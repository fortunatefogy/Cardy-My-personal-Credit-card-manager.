name: cardy
description: A private-first credit card benefits manager for India.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.2
  html: ^0.15.5
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  u_credit_card: ^1.6.0
  flutter_tilt: ^4.1.0
  local_auth: ^2.3.0
  card_scanner: ^1.0.4
  hugeicons: ^1.2.0
  salomon_bottom_bar: ^3.3.2
  horizontal_credit_card: ^0.0.2
  image_picker: ^1.1.2
  animations: ^2.0.11
  silky_scroll: ^1.0.16
  animated_custom_dropdown: ^4.0.0
  lottie: ^3.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
dependency_overrides:
  # u_credit_card 1.6.0 uses Matrix4.scaleByDouble, added after Flutter's pin.
  vector_math: 2.2.0
flutter:
  uses-material-design: true
  assets:
    - assets/splash/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic
          weight: 600
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 16
flutter_native_splash:
  color: '#FFFFFF'
  color_dark: '#FFFFFF'
  android: true
  ios: false
